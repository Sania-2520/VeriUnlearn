[project]
name = "veriunlearn-ml-engine"
version = "1.0.0"
description = "ML Engine for VeriUnlearn - Machine Unlearning, Verification, and Security"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E9", "F", "I", "W"]
ignore = ["E402", "F401"]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F841", "E741"]
"api.py" = ["F811"]
"explainability/*" = ["F841"]
"inference/*" = ["F841"]
"security/attacks/*" = ["F841"]
"training/benchmarks.py" = ["F841"]
"training/drift_detector.py" = ["F841"]
"training/lora_trainer.py" = ["F841"]
"training/model_registry.py" = ["F841"]
"training/rag_pipeline.py" = ["F841"]
"unlearning/algorithms/sisa.py" = ["F841"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
allow_untyped_decorators = true

# This package relies on PyTorch/numpy dynamic typing and framework DI idioms
# whose attribute types are inherently incompatible with strict mypy defaults.
# Mirroring the repository root configuration, the genuinely valuable checks
# (bad attribute access, wrong argument types, interface/override mismatches)
# remain enabled while the known ORM/ML-framework idiom codes are scoped to the
# layers where they occur.
[[tool.mypy.overrides]]
module = [
    "api.*",
    "training.*",
    "models.*",
    "inference.*",
    "explainability.*",
    "security.*",
    "verification.*",
    "unlearning.*",
]
disable_error_code = [
    "assignment",
    "arg-type",
    "dict-item",
    "list-item",
    "return-value",
    "index",
    "no-any-return",
    "type-arg",
    "type-var",
    "call-arg",
    "misc",
    "union-attr",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
