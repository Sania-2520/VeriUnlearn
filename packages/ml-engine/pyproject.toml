[project]
name = "veriunlearn-ml-engine"
version = "1.0.0"
description = "ML Engine for VeriUnlearn - Machine Unlearning, Verification, and Security"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore-missing-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
