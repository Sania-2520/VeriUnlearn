[project]
name = "veriunlearn-ml-engine"
version = "1.0.0"
description = "ML Engine for VeriUnlearn - Machine Unlearning, Verification, and Security"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E9", "F", "I", "W"]
ignore = ["E402", "F401"]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F841", "E741"]
"api.py" = ["F811"]
"explainability/*" = ["F841"]
"inference/*" = ["F841"]
"security/attacks/*" = ["F841"]
"training/benchmarks.py" = ["F841"]
"training/drift_detector.py" = ["F841"]
"training/lora_trainer.py" = ["F841"]
"training/model_registry.py" = ["F841"]
"training/rag_pipeline.py" = ["F841"]
"unlearning/algorithms/sisa.py" = ["F841"]

[tool.mypy]
python_version = "3.12"
ignore-missing-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
