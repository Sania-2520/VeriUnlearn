name: Deploy

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ${{ github.repository }}/backend
  IMAGE_FRONTEND: ${{ github.repository }}/frontend

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL || 'https://api.veriunlearn.example/api/v1' }}

  deploy-staging:
    needs: docker
    runs-on: ubuntu-latest
    environment: staging
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - name: Notify staging (webhook)
        run: |
          if [ -n "${{ secrets.STAGING_DEPLOY_HOOK }}" ]; then
            curl -fsS -X POST "${{ secrets.STAGING_DEPLOY_HOOK }}" \
              -H "Content-Type: application/json" \
              -d "{\"tag\":\"${{ github.ref_name }}\",\"sha\":\"${{ github.sha }}\"}" \
              && echo "staging notified" || echo "staging hook failed (non-fatal)"
          else
            echo "STAGING_DEPLOY_HOOK not configured — skipping notify"
          fi
      - name: Record deployment (API)
        run: |
          if [ -n "${{ secrets.ADMIN_API_URL }}" ] && [ -n "${{ secrets.ADMIN_API_TOKEN }}" ]; then
            curl -fsS -X POST "${{ secrets.ADMIN_API_URL }}/api/v1/admin/deployments" \
              -H "Authorization: Bearer ${{ secrets.ADMIN_API_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d "{\"version\":\"${{ github.ref_name }}\",\"environment\":\"staging\",\"status\":\"pending\",\"commit_sha\":\"${{ github.sha }}\"}" \
              && echo "deployment recorded" || echo "record failed (non-fatal)"
          else
            echo "ADMIN_API_URL/ADMIN_API_TOKEN not configured — skipping record"
          fi
