name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [backend, frontend, ml-engine]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python (Backend)
        if: matrix.package == 'backend' || matrix.package == 'ml-engine'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js (Frontend)
        if: matrix.package == 'frontend'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Lint Backend
        if: matrix.package == 'backend'
        run: |
          pip install ruff mypy
          ruff check packages/backend/
          mypy packages/backend/ --ignore-missing-imports

      - name: Lint ML Engine
        if: matrix.package == 'ml-engine'
        run: |
          pip install ruff mypy
          ruff check packages/ml-engine/
          mypy packages/ml-engine/ --ignore-missing-imports

      - name: Lint Frontend
        if: matrix.package == 'frontend'
        run: |
          cd packages/frontend
          npm ci
          npm run lint

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: p/default

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2

  test:
    name: Test
    needs: [lint, security-scan]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: veriunlearn
          POSTGRES_PASSWORD: veriunlearn
          POSTGRES_DB: veriunlearn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        package: [backend, ml-engine]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        working-directory: packages/${{ matrix.package }}
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run Tests
        working-directory: packages/${{ matrix.package }}
        run: pytest --cov --cov-report=xml --cov-report=term -v
        env:
          DATABASE_URL: postgresql+asyncpg://veriunlearn:veriunlearn@localhost:5432/veriunlearn_test
          ENVIRONMENT: test

      - name: Upload Coverage
        uses: codecov/codecov-action@v3
        with:
          file: packages/${{ matrix.package }}/coverage.xml

  build:
    name: Build & Scan
    needs: [test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [backend, frontend, ml-engine]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: packages/${{ matrix.package }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.package }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.package }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.package }}:${{ env.IMAGE_TAG }}
          format: sarif
          output: trivy-results.sarif

      - name: Upload Scan Results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: trivy-results.sarif
