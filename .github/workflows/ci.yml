name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  KMP_DUPLICATE_LIB_OK: "TRUE"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: veriunlearn
          POSTGRES_PASSWORD: veriunlearn_secret
          POSTGRES_DB: veriunlearn
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready -U veriunlearn
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy app --ignore-missing-imports

      - name: Run unit tests
        run: pytest -v --tb=short -x
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          JWT_SECRET_KEY: test-secret-key-for-ci
          APP_SECRET_KEY: test-app-secret-for-ci

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx next lint --no-cache 2>&1 || true

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
