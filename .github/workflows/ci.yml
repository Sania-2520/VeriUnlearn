name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  KMP_DUPLICATE_LIB_OK: "TRUE"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: veriunlearn
          POSTGRES_PASSWORD: veriunlearn_secret
          POSTGRES_DB: veriunlearn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U veriunlearn -h localhost"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: packages/backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check app tests

      - name: Type check
        run: mypy app --ignore-missing-imports --config-file ../../pyproject.toml

      - name: Security scan
        run: bandit -r app -q

      - name: Run unit tests
        run: pytest -v --tb=short -x --cov=app --cov-report=xml --cov-report=term-missing
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          JWT_SECRET_KEY: test-secret-key-for-ci-only-32-characters!!
          APP_SECRET_KEY: test-app-secret-for-ci-only-32-characters!

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: packages/backend/coverage.xml

  ml-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ml-engine

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/ml-engine/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check . --ignore E402,F401

      - name: Security scan
        run: bandit -r api training inference security verification unlearning explainability models -q

      - name: Run tests
        run: |
          python -m pytest -v --tb=short -x tests/ > pytest-out.txt 2>&1 || { tail -60 pytest-out.txt > failing-tests.txt; exit 1; }
      - name: Report failing tests
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const p = 'packages/ml-engine/failing-tests.txt';
            const msg = fs.existsSync(p) ? fs.readFileSync(p, 'utf8') : 'pytest produced no output';
            core.error(msg);

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx next lint --no-cache --max-warnings=0

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend, ml-engine, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service: [backend, ml-engine, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ./packages/${{ matrix.service }}
          file: ./packages/${{ matrix.service }}/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ matrix.service }}:latest,ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security-scan:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      - name: Run Gitleaks secrets scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  compose-check:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config --quiet
      - name: Validate production env template
        run: |
          test -f .env.production.example || { echo ".env.production.example missing"; exit 1; }
          echo "production env template present"
      - name: Hadolint (Dockerfile lint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: packages/backend/Dockerfile
          failure-threshold: error
      - name: Hadolint (frontend)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: packages/frontend/Dockerfile
          failure-threshold: error
