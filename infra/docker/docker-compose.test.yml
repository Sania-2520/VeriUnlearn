services:
  test-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: veriunlearn
      POSTGRES_PASSWORD: veriunlearn
      POSTGRES_DB: veriunlearn_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veriunlearn -d veriunlearn_test"]
      interval: 2s
      timeout: 2s
      retries: 10

  test-redis:
    image: redis:7-alpine
    command: redis-server --requirepass veriunlearn
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

  test-backend:
    build:
      context: ../../packages/backend
      dockerfile: Dockerfile
    environment:
      - ENVIRONMENT=testing
      - DEBUG=false
      - DATABASE_URL=postgresql+asyncpg://veriunlearn:veriunlearn@test-db:5432/veriunlearn_test
      - REDIS_URL=redis://:veriunlearn@test-redis:6379/0
      - CELERY_BROKER_URL=redis://:veriunlearn@test-redis:6379/1
      - CELERY_RESULT_BACKEND=redis://:veriunlearn@test-redis:6379/2
      - ML_ENGINE_URL=http://test-ml-engine:8001
      - SECRET_KEY=test-secret-key-for-ci-at-least-32-chars!!
      - JWT_SECRET_KEY=test-jwt-secret-for-ci-at-least-32-chars!!
      - JWT_ALGORITHM=HS256
      - CELERY_TASK_ALWAYS_EAGER=true
      - CORS_ORIGINS=http://localhost:3000
      - SMTP_HOST=
      - SMTP_PORT=587
    depends_on:
      test-db:
        condition: service_healthy
      test-redis:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/app/scripts/run_tests.sh"]
    volumes:
      - ../../packages/backend:/app
    working_dir: /app
