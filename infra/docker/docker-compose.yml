version: "3.9"

name: veriunlearn

services:
  # ─── API Gateway ──────────────────────────────────────────
  traefik:
    image: traefik:v3.2
    container_name: veriunlearn-traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=admin@veriunlearn.com"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "traefik-data:/letsencrypt"
    networks:
      - veriunlearn-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`traefik.localhost`)"
      - "traefik.http.routers.api.service=api@internal"

  # ─── Backend ─────────────────────────────────────────────
  backend:
    build:
      context: ../../packages/backend
      dockerfile: Dockerfile
    container_name: veriunlearn-backend
    env_file:
      - ../../.env
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://veriunlearn:veriunlearn@postgres:5432/veriunlearn
      - REDIS_URL=redis://:veriunlearn@redis:6379/0
      - CELERY_BROKER_URL=redis://:veriunlearn@redis:6379/1
      - CELERY_RESULT_BACKEND=redis://:veriunlearn@redis:6379/2
      - QDRANT_URL=http://qdrant:6333
      - MINIO_ENDPOINT=minio:9000
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    volumes:
      - ../../packages/backend:/app
      - backend-data:/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - veriunlearn-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`api.localhost`)"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"

  # ─── Celery Worker ──────────────────────────────────────
  celery-worker:
    build:
      context: ../../packages/backend
      dockerfile: Dockerfile
    container_name: veriunlearn-celery
    env_file:
      - ../../.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://veriunlearn:veriunlearn@postgres:5432/veriunlearn
      - REDIS_URL=redis://:veriunlearn@redis:6379/0
      - CELERY_BROKER_URL=redis://:veriunlearn@redis:6379/1
      - CELERY_RESULT_BACKEND=redis://:veriunlearn@redis:6379/2
      - QDRANT_URL=http://qdrant:6333
      - MINIO_ENDPOINT=minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    volumes:
      - ../../packages/backend:/app
      - backend-data:/data
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4
    networks:
      - veriunlearn-network

  # ─── Frontend ────────────────────────────────────────────
  frontend:
    build:
      context: ../../packages/frontend
      dockerfile: Dockerfile
    container_name: veriunlearn-frontend
    env_file:
      - ../../.env
    environment:
      - NEXT_PUBLIC_API_URL=http://api.localhost
    ports:
      - "3000:3000"
    volumes:
      - ../../packages/frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
    networks:
      - veriunlearn-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`app.localhost`)"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"

  # ─── ML Engine ──────────────────────────────────────────
  ml-engine:
    build:
      context: ../../packages/ml-engine
      dockerfile: Dockerfile
    container_name: veriunlearn-ml
    env_file:
      - ../../.env
    environment:
      - QDRANT_URL=http://qdrant:6333
      - MINIO_ENDPOINT=minio:9000
    ports:
      - "8001:8000"
    volumes:
      - ../../packages/ml-engine:/app
      - ml-data:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - veriunlearn-network

  # ─── PostgreSQL ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: veriunlearn-postgres
    environment:
      POSTGRES_USER: veriunlearn
      POSTGRES_PASSWORD: veriunlearn
      POSTGRES_DB: veriunlearn
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init/postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veriunlearn"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - veriunlearn-network

  # ─── Redis ───────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: veriunlearn-redis
    command: redis-server --requirepass veriunlearn --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - veriunlearn-network

  # ─── RabbitMQ ────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: veriunlearn-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - veriunlearn-network

  # ─── Qdrant ──────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: veriunlearn-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - veriunlearn-network

  # ─── MinIO ───────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: veriunlearn-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: veriunlearn
      MINIO_ROOT_PASSWORD: veriunlearn123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - veriunlearn-network

  # ─── Monitoring ─────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: veriunlearn-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    networks:
      - veriunlearn-network

  grafana:
    image: grafana/grafana:11.3.0
    container_name: veriunlearn-grafana
    ports:
      - "3001:3000"
    volumes:
      - ../monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ../monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - veriunlearn-network

  loki:
    image: grafana/loki:3.2.1
    container_name: veriunlearn-loki
    ports:
      - "3100:3100"
    volumes:
      - ../monitoring/loki/loki.yml:/etc/loki/loki.yml
      - loki-data:/loki
    command: -config.file=/etc/loki/loki.yml
    networks:
      - veriunlearn-network


networks:
  veriunlearn-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  qdrant-data:
  minio-data:
  traefik-data:
  backend-data:
  ml-data:
  prometheus-data:
  grafana-data:
  loki-data:
