global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "veriunlearn-backend"
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
        labels:
          service: "backend"
          environment: "development"

  - job_name: "veriunlearn-ml-engine"
    metrics_path: /metrics
    static_configs:
      - targets: ["ml-engine:8000"]
        labels:
          service: "ml-engine"
          environment: "development"

  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: "qdrant"
    metrics_path: /metrics
    static_configs:
      - targets: ["qdrant:6333"]

  - job_name: "rabbitmq"
    metrics_path: /metrics
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: "mlflow"
    metrics_path: /metrics
    static_configs:
      - targets: ["mlflow:5000"]
        labels:
          service: "mlflow"
          environment: "development"

  - job_name: "nvidia-gpu"
    metrics_path: /metrics
    static_configs:
      - targets: ["nvidia-exporter:9445"]
        labels:
          service: "gpu-exporter"
          environment: "development"

  - job_name: "training-metrics"
    metrics_path: /metrics
    scrape_interval: 30s
    static_configs:
      - targets: ["ml-engine:8001"]
        labels:
          service: "training"
          environment: "development"
