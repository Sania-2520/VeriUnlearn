route:
  group_by: ["alertname", "severity", "team"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: default
  routes:
    - match:
        severity: critical
      receiver: pagerduty-critical
      repeat_interval: 10m
    - match:
        severity: warning
      receiver: slack-warning
    - match:
        team: compliance
      receiver: slack-compliance

receivers:
  - name: default
    slack_configs:
      - api_url: "SLACK_WEBHOOK_URL_PLACEHOLDER"
        channel: "#veriunlearn-alerts"
        send_resolved: true
        title: "{{ .GroupLabels.alertname }} [{{ .GroupLabels.severity }}]"
        text: "{{ .CommonAnnotations.description }}"

  - name: pagerduty-critical
    pagerduty_configs:
      - routing_key: "PAGERDUTY_ROUTING_KEY_PLACEHOLDER"
        severity: critical
        description: "{{ .CommonAnnotations.summary }}"

  - name: slack-warning
    slack_configs:
      - api_url: "SLACK_WEBHOOK_URL_PLACEHOLDER"
        channel: "#veriunlearn-warnings"
        send_resolved: true
        title: "⚠️ {{ .GroupLabels.alertname }}"
        text: "{{ .CommonAnnotations.description }}"

  - name: slack-compliance
    slack_configs:
      - api_url: "SLACK_WEBHOOK_URL_PLACEHOLDER"
        channel: "#veriunlearn-compliance"
        send_resolved: true
        title: "🔐 Compliance Alert: {{ .GroupLabels.alertname }}"
        text: "{{ .CommonAnnotations.description }}"

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ["alertname", "team"]
