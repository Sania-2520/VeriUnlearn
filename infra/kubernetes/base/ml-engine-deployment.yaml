apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-engine
  namespace: veriunlearn
  labels:
    app.kubernetes.io/name: veriunlearn
    app.kubernetes.io/component: ml-engine
    app.kubernetes.io/part-of: veriunlearn
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: veriunlearn
      app.kubernetes.io/component: ml-engine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: veriunlearn
        app.kubernetes.io/component: ml-engine
        app.kubernetes.io/part-of: veriunlearn
    spec:
      serviceAccountName: veriunlearn-ml-engine
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      nodeSelector:
        node-type: gpu
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: ml-engine
          image: veriunlearn/ml-engine:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8001
              protocol: TCP
          envFrom:
            - configMapRef:
                name: veriunlearn-config
            - secretRef:
                name: veriunlearn-secret
          env:
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility
            - name: CUDA_VISIBLE_DEVICES
              value: "0"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: 1000m
              memory: 2Gi
              nvidia.com/gpu: 1
            limits:
              cpu: 2000m
              memory: 4Gi
              nvidia.com/gpu: 1
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: ml-engine-data
              mountPath: /app/checkpoints
            - name: ml-engine-models
              mountPath: /app/models
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: ml-engine-data
          persistentVolumeClaim:
            claimName: ml-engine-checkpoints-pvc
        - name: ml-engine-models
          persistentVolumeClaim:
            claimName: ml-engine-models-pvc
        - name: tmp
          emptyDir: {}
