apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-data-pvc
  namespace: veriunlearn
  labels:
    app.kubernetes.io/name: veriunlearn
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: veriunlearn
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
