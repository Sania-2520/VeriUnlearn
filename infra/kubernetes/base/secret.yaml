apiVersion: v1
kind: Secret
metadata:
  name: veriunlearn-secret
  namespace: veriunlearn
  labels:
    app.kubernetes.io/name: veriunlearn
    app.kubernetes.io/part-of: veriunlearn
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://veriunlearn:CHANGE_ME@postgresql-primary:5432/veriunlearn"
  DATABASE_PASSWORD: "CHANGE_ME"
  REDIS_PASSWORD: "CHANGE_ME"
  JWT_SECRET_KEY: "CHANGE_ME_USE_OPENSSL_RAND_BASE64_64"
  JWT_ALGORITHM: "HS256"
  JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "30"
  JWT_REFRESH_TOKEN_EXPIRE_DAYS: "7"
  ENCRYPTION_KEY: "CHANGE_ME_USE_OPENSSL_RAND_HEX_32"
  AWS_ACCESS_KEY_ID: "CHANGE_ME"
  AWS_SECRET_ACCESS_KEY: "CHANGE_ME"
  AWS_REGION: "us-east-1"
  S3_BUCKET_NAME: "veriunlearn-data"
  MLFLOW_TRACKING_PASSWORD: "CHANGE_ME"
  SENTRY_AUTH_TOKEN: "CHANGE_ME"
