apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  namespace: veriunlearn
  labels:
    app.kubernetes.io/name: veriunlearn
    app.kubernetes.io/component: celery-worker
    app.kubernetes.io/part-of: veriunlearn
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: veriunlearn
      app.kubernetes.io/component: celery-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: veriunlearn
        app.kubernetes.io/component: celery-worker
        app.kubernetes.io/part-of: veriunlearn
    spec:
      serviceAccountName: veriunlearn-backend
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: celery-worker
          image: veriunlearn/backend:latest
          imagePullPolicy: Always
          command:
            - celery
            - -A
            - app.core.celery_app
            - worker
            - --loglevel=info
            - --concurrency=4
            - -Q
            - default,model_training,verification
          envFrom:
            - configMapRef:
                name: veriunlearn-config
            - secretRef:
                name: veriunlearn-secret
          env:
            - name: CELERY_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 1000m
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: worker-data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: worker-data
          persistentVolumeClaim:
            claimName: celery-worker-data-pvc
        - name: tmp
          emptyDir: {}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: veriunlearn
              app.kubernetes.io/component: celery-worker
