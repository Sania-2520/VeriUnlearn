apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: veriunlearn

resources:
  - ../../base

patches:
  - path: backend-patch.yaml
    target:
      kind: Deployment
      name: backend
  - path: ml-engine-patch.yaml
    target:
      kind: Deployment
      name: ml-engine
  - target:
      kind: ConfigMap
      name: veriunlearn-config
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: veriunlearn-config
      data:
        ENVIRONMENT: "production"
        LOG_LEVEL: "warning"
        LOG_FORMAT: "json"
        CORS_ORIGINS: "https://veriunlearn.example.com"
        FRONTEND_URL: "https://veriunlearn.example.com"
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: frontend
      spec:
        replicas: 3
        template:
          spec:
            containers:
              - name: frontend
                resources:
                  requests:
                    cpu: 200m
                    memory: 512Mi
                  limits:
                    cpu: 500m
                    memory: 1Gi
  - target:
      kind: Deployment
      name: celery-worker
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: celery-worker
      spec:
        replicas: 3
        template:
          spec:
            containers:
              - name: celery-worker
                resources:
                  requests:
                    cpu: 500m
                    memory: 2Gi
                  limits:
                    cpu: 1000m
                    memory: 4Gi
