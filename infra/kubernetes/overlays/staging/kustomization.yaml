apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: veriunlearn-staging

resources:
  - ../../base

namePrefix: staging-

commonLabels:
  environment: staging

patches:
  - target:
      kind: ConfigMap
      name: veriunlearn-config
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: veriunlearn-config
      data:
        ENVIRONMENT: "staging"
        LOG_LEVEL: "debug"
        LOG_FORMAT: "text"
        CORS_ORIGINS: "https://staging.veriunlearn.example.com"
        FRONTEND_URL: "https://staging.veriunlearn.example.com"
  - target:
      kind: Secret
      name: veriunlearn-secret
    patch: |-
      apiVersion: v1
      kind: Secret
      metadata:
        name: veriunlearn-secret
      stringData:
        DATABASE_URL: "postgresql+asyncpg://veriunlearn:staging-password@postgresql-primary:5432/veriunlearn_staging"
  - target:
      kind: Deployment
      name: backend
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: backend
      spec:
        replicas: 1
        template:
          spec:
            containers:
              - name: backend
                resources:
                  requests:
                    cpu: 250m
                    memory: 512Mi
                  limits:
                    cpu: 500m
                    memory: 1Gi
  - target:
      kind: Deployment
      name: ml-engine
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ml-engine
      spec:
        replicas: 1
        template:
          spec:
            containers:
              - name: ml-engine
                resources:
                  requests:
                    cpu: 500m
                    memory: 1Gi
                  limits:
                    cpu: 1000m
                    memory: 2Gi
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: frontend
      spec:
        replicas: 1
  - target:
      kind: Deployment
      name: celery-worker
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: celery-worker
      spec:
        replicas: 1
