{{- if .Values.podDisruptionBudget.backend.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "veriunlearn.fullname" . }}-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "veriunlearn.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  minAvailable: {{ .Values.podDisruptionBudget.backend.minAvailable }}
  selector:
    matchLabels:
      {{- include "veriunlearn.backend.selectorLabels" . | nindent 6 }}
{{- end }}
---
