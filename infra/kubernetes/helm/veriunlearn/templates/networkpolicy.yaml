{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "veriunlearn.fullname" . }}-default-deny
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "veriunlearn.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "veriunlearn.fullname" . }}-allow-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "veriunlearn.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "veriunlearn.frontend.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from: []
      ports:
        - port: {{ .Values.service.frontend.port }}
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "veriunlearn.backend.selectorLabels" . | nindent 14 }}
      ports:
        - port: {{ .Values.service.backend.port }}
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "veriunlearn.fullname" . }}-allow-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "veriunlearn.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "veriunlearn.backend.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "veriunlearn.frontend.selectorLabels" . | nindent 14 }}
      ports:
        - port: {{ .Values.service.backend.port }}
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              {{- include "veriunlearn.celeryWorker.selectorLabels" . | nindent 14 }}
      ports:
        - port: {{ .Values.service.backend.port }}
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "veriunlearn.mlEngine.selectorLabels" . | nindent 14 }}
      ports:
        - port: {{ .Values.service.mlEngine.port }}
          protocol: TCP
    - to:
        - namespaceSelector: {}
      ports:
        - port: 5432
          protocol: TCP
        - port: 6379
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "veriunlearn.fullname" . }}-allow-ml-engine
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "veriunlearn.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "veriunlearn.mlEngine.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "veriunlearn.backend.selectorLabels" . | nindent 14 }}
      ports:
        - port: {{ .Values.service.mlEngine.port }}
          protocol: TCP
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - port: 5432
          protocol: TCP
        - port: 6379
          protocol: TCP
    - to:
        - namespaceSelector: {}
      ports:
        - port: 443
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "veriunlearn.fullname" . }}-allow-celery-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "veriunlearn.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "veriunlearn.celeryWorker.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "veriunlearn.backend.selectorLabels" . | nindent 14 }}
      ports:
        - port: {{ .Values.service.backend.port }}
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              {{- include "veriunlearn.mlEngine.selectorLabels" . | nindent 14 }}
      ports:
        - port: {{ .Values.service.mlEngine.port }}
          protocol: TCP
    - to:
        - namespaceSelector: {}
      ports:
        - port: 5432
          protocol: TCP
        - port: 6379
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
{{- end }}
