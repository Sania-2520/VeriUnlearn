{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "veriunlearn.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "veriunlearn.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "veriunlearn.fullname" . }}-role
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "veriunlearn.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "veriunlearn.fullname" . }}-rolebinding
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "veriunlearn.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "veriunlearn.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "veriunlearn.fullname" . }}-role
  apiGroup: rbac.authorization.k8s.io
{{- end }}
