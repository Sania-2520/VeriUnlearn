# VeriUnlearn - production-ready Docker Compose
#
# Quick start (full stack, no monitoring):
#   cp .env.example .env && docker compose up -d
#
# With observability (Prometheus / Grafana / Loki / Alertmanager):
#   docker compose --profile monitoring up -d
#
# One-command setup: see scripts/setup.sh / scripts/setup.ps1
name: veriunlearn

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-production}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-veriunlearn}:${POSTGRES_PASSWORD:-veriunlearn_secret}@postgres:5432/${POSTGRES_DB:-veriunlearn}
  REDIS_URL: redis://:${REDIS_PASSWORD:-veriunlearn_secret}@redis:6379/0
  CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-veriunlearn_secret}@redis:6379/1
  CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-veriunlearn_secret}@redis:6379/2
  ML_ENGINE_URL: http://ml-engine:8000
  QDRANT_URL: http://qdrant:6333
  MINIO_ENDPOINT: minio:9000
  MINIO_ROOT_USER: ${MINIO_ROOT_USER:-veriunlearn}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-veriunlearn_secret}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-jwt-secret-key-at-least-32-chars-long!!}
  APP_SECRET_KEY: ${APP_SECRET_KEY:-dev-app-secret-key-at-least-32-chars-long!!!}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
  RAG_STORAGE_DIR: /data/rag
  PROMETHEUS_ENABLED: ${PROMETHEUS_ENABLED:-true}
  LOG_FORMAT: ${LOG_FORMAT:-json}

services:
  postgres:
    image: postgres:16-alpine
    container_name: veriunlearn-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-veriunlearn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-veriunlearn_secret}
      POSTGRES_DB: ${POSTGRES_DB:-veriunlearn}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-veriunlearn}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 1m
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    networks:
      - veriunlearn-network
    labels:
      com.veriunlearn.service: postgres

  redis:
    image: redis:7-alpine
    container_name: veriunlearn-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-veriunlearn_secret}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-veriunlearn_secret}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    networks:
      - veriunlearn-network
    labels:
      com.veriunlearn.service: redis

  qdrant:
    image: qdrant/qdrant:v1.18.2
    container_name: veriunlearn-qdrant
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    networks:
      - veriunlearn-network
    labels:
      com.veriunlearn.service: qdrant

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: veriunlearn-minio
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-veriunlearn}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-veriunlearn_secret}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 1m
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    networks:
      - veriunlearn-network
    labels:
      com.veriunlearn.service: minio

  backend:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile
      args:
        APP_ENV: ${APP_ENV:-production}
    image: ${IMAGE_REGISTRY:-ghcr.io/veriunlearn}/backend:${IMAGE_TAG:-latest}
    container_name: veriunlearn-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - backend-data:/data
      - rag-data:/data/rag
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    networks:
      - veriunlearn-network
    labels:
      com.veriunlearn.service: backend

  worker:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile
      args:
        APP_ENV: ${APP_ENV:-production}
    image: ${IMAGE_REGISTRY:-ghcr.io/veriunlearn}/backend:${IMAGE_TAG:-latest}
    container_name: veriunlearn-worker
    environment:
      <<: *backend-env
      CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-4}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - backend-data:/data
      - rag-data:/data/rag
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=${CELERY_WORKER_CONCURRENCY:-4}
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 1m
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    networks:
      - veriunlearn-network
    labels:
      com.veriunlearn.service: worker

  ml-engine:
    build:
      context: ./packages/ml-engine
      dockerfile: Dockerfile
    image: ${IMAGE_REGISTRY:-ghcr.io/veriunlearn}/ml-engine:${IMAGE_TAG:-latest}
    container_name: veriunlearn-ml-engine
    ports:
      - "${ML_ENGINE_PORT:-8001}:8000"
    environment:
      APP_ENV: ${APP_ENV:-production}
      QDRANT_URL: http://qdrant:6333
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-veriunlearn}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-veriunlearn_secret}
      RAG_STORAGE_PATH: /data/rag
      DEVICE: ${ML_DEVICE:-cpu}
      PROMETHEUS_ENABLED: ${PROMETHEUS_ENABLED:-true}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    depends_on:
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ml-data:/data
      - rag-data:/data/rag
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8G
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - veriunlearn-network
    labels:
      com.veriunlearn.service: ml-engine

  frontend:
    build:
      context: ./packages/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    image: ${IMAGE_REGISTRY:-ghcr.io/veriunlearn}/frontend:${IMAGE_TAG:-latest}
    container_name: veriunlearn-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    networks:
      - veriunlearn-network
    labels:
      com.veriunlearn.service: frontend

  nginx:
    image: nginx:1.27-alpine
    container_name: veriunlearn-nginx
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks:
      - veriunlearn-network
    labels:
      com.veriunlearn.service: nginx

  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["monitoring"]
    container_name: veriunlearn-prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    networks:
      - veriunlearn-network
    labels:
      com.veriunlearn.service: prometheus

  alertmanager:
    image: prom/alertmanager:v0.27.0
    profiles: ["monitoring"]
    container_name: veriunlearn-alertmanager
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./infra/monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "amtool check-config /etc/alertmanager/alertmanager.yml || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 128M
    networks:
      - veriunlearn-network
    labels:
      com.veriunlearn.service: alertmanager

  grafana:
    image: grafana/grafana:11.3.0
    profiles: ["monitoring"]
    container_name: veriunlearn-grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./infra/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infra/monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana-data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
      GF_USERS_ALLOW_SIGN_UP: "false"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    networks:
      - veriunlearn-network
    labels:
      com.veriunlearn.service: grafana

  loki:
    image: grafana/loki:3.2.1
    profiles: ["monitoring"]
    container_name: veriunlearn-loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./infra/monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/loki.yml
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    networks:
      - veriunlearn-network
    labels:
      com.veriunlearn.service: loki

networks:
  veriunlearn-network:
    driver: bridge
    name: veriunlearn-network

volumes:
  postgres-data:
  redis-data:
  qdrant-data:
  minio-data:
  backend-data:
  ml-data:
  rag-data:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  loki-data:
  nginx-logs:
