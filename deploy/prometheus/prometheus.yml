global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "veriunlearn-backend"
    metrics_path: /metrics
    # Uncomment + set when METRICS_TOKEN is configured on the backend:
    # authorization:
    #   credentials: ${METRICS_TOKEN}
    static_configs:
      - targets: ["backend:8000"]
        labels:
          service: veriunlearn
