events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Request body limit (upload cap).
    client_max_body_size 60m;

    # Basic rate limiting zone (complements backend slowapi).
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    # Security headers (defense in depth; backend also sets these).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    upstream frontend {
        server frontend:3000;
    }
    upstream backend {
        server backend:8000;
    }

    server {
        listen 80;
        server_name _;

        # Health checks bypass rate limits.
        location = /health {
            proxy_pass http://backend/health;
        }

        location /api/ {
            limit_req zone=api burst=40 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_connect_timeout 10s;
        }

        location /metrics {
            # Scraped by Prometheus from inside the compose network; optional
            # token auth is enforced by the backend (METRICS_TOKEN).
            proxy_pass http://backend/metrics;
        }

        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
